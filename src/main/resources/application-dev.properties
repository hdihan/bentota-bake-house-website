# ===============================
# DEVELOPMENT PROFILE SETTINGS
# ===============================
# This file is used when spring.profiles.active=dev

# Show SQL queries for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Thymeleaf cache for hot reload
spring.thymeleaf.cache=false

# Enable DevTools for auto-restart
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Detailed logging for development
logging.level.com.bakery.system=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO

# Enable payment demo mode
demo.payment.enabled=true

# Session timeout longer for development (60 minutes)
server.servlet.session.timeout=60m

# Server port (can be different from production)
server.port=8080

# Print startup banner
spring.banner.charset=UTF-8

# Enable H2 console for testing (optional)
# spring.h2.console.enabled=true