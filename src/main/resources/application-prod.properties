# ===============================
# PRODUCTION PROFILE SETTINGS
# ===============================
# This file is used when spring.profiles.active=prod

# Disable SQL logging for performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable Thymeleaf cache for better performance
spring.thymeleaf.cache=true

# Disable DevTools in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Production logging level
logging.level.com.bakery.system=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Disable payment demo mode
demo.payment.enabled=false

# Session timeout shorter for security (30 minutes)
server.servlet.session.timeout=30m

# Secure session cookies in production
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Production server port (can be changed)
server.port=8080

# Error handling
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000