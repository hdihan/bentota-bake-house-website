<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Categories – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Local Font Awesome (adjust path if needed) -->
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .cat-icon {
            width: 45px; height: 45px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            background: var(--brand-light); color: var(--brand);
        }
        /* FIX: force Font Awesome weight */
        .cat-icon i {
            font-weight: 900 !important;
        }
    </style>
</head>
<body th:class="${role + '-theme'}">

<nav class="top-nav top-nav-dark">
    <div class="container">
        <div class="d-flex align-items-center gap-3">
            <a href="/dashboard" class="btn-back text-white"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <span class="page-title font-playfair text-white">Product Categories</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white"><i class="fas fa-user-circle me-1"></i><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn-logout"><i class="fas fa-sign-out-alt me-1"></i> Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-custom py-5">
    <div th:if="${param.success}" class="alert alert-success">Category added!</div>
    <div th:if="${param.updated}" class="alert alert-success">Category updated!</div>
    <div th:if="${param.deleted}" class="alert alert-danger">Category deleted!</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card d-flex align-items-center gap-3">
                <div class="stat-icon" style="background:var(--brand-light);"><i class="fas fa-tags" style="color:var(--brand)"></i></div>
                <div>
                    <small class="text-muted">Total Categories</small>
                    <h3 class="fw-bold" th:text="${#lists.size(categories)}">0</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold"><i class="fas fa-tags me-2 text-muted"></i> Category Catalog</h5>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal"><i class="fas fa-plus me-1"></i> Add Category</button>
        </div>
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr><th>Icon</th><th>Category</th><th class="text-center">Products</th><th class="text-end">Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td><div class="cat-icon"><i class="fas fa-tag"></i></div></td>
                    <td>
                        <div class="fw-bold" th:text="${category.name}"></div>
                        <small class="text-muted" th:text="${category.description}"></small>
                    </td>
                    <td class="text-center"><span class="badge bg-light text-dark border" th:text="${categoryCounts[category.name] != null ? categoryCounts[category.name] : 0} + ' Items'">0 Items</span></td>
                    <td class="text-end">
                        <button type="button" class="btn btn-sm btn-outline" data-bs-toggle="modal" th:data-bs-target="'#editCategoryModal' + ${category.id}">
                            <i class="fas fa-pen"></i> Edit
                        </button>
                        <a th:href="@{/delete-category/{id}(id=${category.id})}" class="btn btn-sm btn-danger ms-1" onclick="return confirm('Delete?')">
                            <i class="fas fa-trash"></i> Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/add-category}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Category Modals -->
<div th:each="category : ${categories}">
    <div class="modal fade" th:id="'editCategoryModal' + ${category.id}" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{/edit-category/{id}(id=${category.id})}" method="post" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" th:value="${category.name}" required></div>
                    <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3" th:text="${category.description}"></textarea></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
