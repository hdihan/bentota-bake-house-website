<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Login – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body { background: linear-gradient(135deg, var(--ink) 0%, #0F172A 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: var(--radius-lg); max-width: 400px; width: 100%; box-shadow: var(--shadow-lg); text-align: center; }
        .login-card img { width: 80px; border-radius: 50%; margin-bottom: 16px; border: 2px solid var(--brand); }
        .btn-login { background: var(--brand); color: white; border: none; padding: 12px; border-radius: var(--radius-sm); font-weight: 600; }
    </style>
</head>
<body th:class="${role + '-theme'}">
<div class="login-card">
    <img src="/images/logo.jpg" alt="Logo">
    <h3>Driver Login</h3>
    <div th:if="${param.error}" class="alert alert-danger">Invalid email or password</div>
    <div th:if="${param.logout}" class="alert alert-info">Logged out</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3"><input type="email" name="username" class="form-control" placeholder="Email" required autofocus></div>
        <div class="mb-3"><input type="password" name="password" class="form-control" placeholder="Password" required></div>
        <button type="submit" class="btn-login w-100">Login as Driver</button>
    </form>
    <hr>
    <a href="/login">← Customer Login</a>
</div>
</body>
</html>
