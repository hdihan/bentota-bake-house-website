<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Failed – Benthota Bake House</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        :root {
            --brand: #C8601A; --brand-dark: #9E4A12; --brand-light: #FDF0E6;
            --cream: #FEFAF5; --ink: #1C1410;
        }
        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .failed-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1.5px solid var(--border);
            box-shadow: 0 12px 40px rgba(28,20,16,0.08);
        }
        .icon-circle {
            width: 80px; height: 80px;
            background: #FEE2E2;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #DC2626;
            margin-bottom: 24px;
        }
        .failed-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .error-reason {
            background: #FEF2F2;
            border-left: 4px solid #DC2626;
            padding: 14px;
            margin: 20px 0;
            text-align: left;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-retry {
            background: var(--brand);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin: 4px;
            transition: background 0.2s;
        }
        .btn-retry:hover { background: var(--brand-dark); }
        .btn-secondary {
            background: var(--cream);
            color: var(--ink);
            border: 1.5px solid var(--border);
            padding: 12px 32px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body th:class="${role + '-theme'}">

<div class="failed-box">
    <div class="icon-circle"><i class="fas fa-exclamation-circle"></i></div>
    <h2 class="failed-title">Payment Failed</h2>
    <p class="text-muted">We couldn’t process your payment. Please try again or use a different card.</p>

    <div class="error-reason">
        <strong>Reason:</strong> <span th:text="${errorMessage}">Payment declined. Please check your card details.</span>
    </div>

    <button onclick="history.back()" class="btn-retry"><i class="fas fa-arrow-left me-2"></i> Try Again</button>
    <br><br>
    <a href="/checkout" class="btn-secondary">← Back to Checkout</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
