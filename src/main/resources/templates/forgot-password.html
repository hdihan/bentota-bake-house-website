<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body { background-image: url('/images/background.jpg'); background-size: cover; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { width: 100%; max-width: 400px; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 15px 35px rgba(0,0,0,0.3); background-color: rgba(255, 255, 255, 0.95); text-align: center; }
        .btn-custom { background-color: #fd7e14; color: white; font-weight: 600; }
        .btn-custom:hover { background-color: #e86e0c; color: white; }
    </style>
</head>
<body th:class="${role + '-theme'}">

<div class="login-card">
    <form th:action="@{/forgot-password}" method="post">
        <h4 class="mb-3 text-dark fw-bold">Recover Account</h4>
        <p class="text-muted mb-4" style="font-size: 0.9rem;">Answer your security question to reset your password.</p>

        <div th:if="${param.error}" class="alert alert-danger py-2 text-sm" role="alert">
            Username or Security Answer is incorrect.
        </div>

        <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus>
            <label for="username" class="text-muted">Username</label>
        </div>

        <div class="mb-3 text-start">
            <select name="securityQuestion" class="form-select" style="padding: 12px;" required>
                <option value="" disabled selected>Select your Security Question...</option>
                <option value="What city were you born in?">What city were you born in?</option>
                <option value="What is your favorite food?">What is your favorite food?</option>
                <option value="What is the name of your first pet?">What is the name of your first pet?</option>
                <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
            </select>
        </div>

        <div class="form-floating mb-4 text-start">
            <input type="text" class="form-control" id="securityAnswer" name="securityAnswer" placeholder="Answer" required>
            <label for="securityAnswer" class="text-muted">Your Answer</label>
        </div>

        <button class="w-100 btn btn-lg btn-custom mb-3" type="submit">Verify Answer</button>

        <a th:href="@{/login}" class="text-muted text-decoration-none" style="font-size: 0.9rem;">← Back to Login</a>
    </form>
</div>
</body>
</html>
