<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav">
    <div class="container">
        <a href="/home" class="brand"><div class="brand-icon"><i class="fas fa-bread-slice"></i></div><span class="brand-name">Benthota Bake House</span></a>
        <a href="/home" class="nav-btn ghost">Back to Store</a>
    </div>
</nav>
<div class="container-custom py-4">
    <h2 class="fw-bold mb-4">My Orders</h2>
    <div th:if="${param.success}" class="alert alert-success">Order cancelled.</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${#lists.isEmpty(orders)}" class="text-center py-5">
        <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
        <p>No orders yet. <a href="/home">Start shopping</a>.</p>
    </div>
    <div th:each="order : ${orders}" class="card mb-3">
        <div class="row">
            <div class="col-md-8">
                <h5 class="fw-bold">Order #<span th:text="${order.id}"></span></h5>
                <p class="text-muted">Placed: <span th:text="${order.orderDate}"></span></p>
                <p>Total: <strong th:text="'Rs. ' + ${order.totalAmount}"></strong></p>
            </div>
            <div class="col-md-4 text-md-end">
                <span class="badge" th:classappend="'status-' + ${order.status}" th:text="${order.status}"></span>
                <div class="mt-2">
                    <a th:href="@{/order/{id}(id=${order.id})}" class="btn btn-sm btn-outline">View Details</a>
                    <form th:if="${order.status == 'PENDING'}" th:action="@{/order/{id}/cancel(id=${order.id})}" method="post" class="d-inline" onsubmit="return confirm('Cancel?')">
                        <button type="submit" class="btn btn-sm btn-danger">Cancel</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
