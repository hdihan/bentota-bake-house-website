<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Access Denied – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .error-container {
            background: white; padding: 50px 40px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg); text-align: center; max-width: 480px;
        }
        .error-icon { font-size: 4rem; color: var(--brand); margin-bottom: 20px; }
        .error-title { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--ink); margin-bottom: 10px; }
        .btn-back { background: var(--brand); color: white; padding: 12px 32px; border-radius: var(--radius-sm); text-decoration: none; font-weight: 600; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body th:class="${role + '-theme'}">
<div class="error-container">
    <div class="error-icon"><i class="fas fa-ban"></i></div>
    <h1 class="error-title">Access Denied</h1>
    <p class="text-muted">You don't have permission to access this page.</p>
    <a href="/dashboard" class="btn-back"><i class="fas fa-arrow-left me-2"></i> Back to Dashboard</a>
</div>
</body>
</html>
