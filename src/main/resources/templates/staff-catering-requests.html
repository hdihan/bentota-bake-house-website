<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Catering Requests – Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav top-nav-dark">
    <div class="container">
        <a href="/dashboard" class="btn-back text-white"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <span class="page-title font-playfair text-white">Catering Requests Management</span>
        <div>
            <span class="text-white me-3"><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="d-inline"><button type="submit" class="btn-logout">Logout</button></form>
        </div>
    </div>
</nav>

<div class="container-custom py-4">
    <div class="d-flex gap-2 mb-3">
        <a href="/staff/catering/requests" class="btn btn-sm btn-outline">All</a>
        <a href="?status=PENDING" class="btn btn-sm btn-outline">Pending</a>
        <a href="?status=QUOTED" class="btn btn-sm btn-outline">Quoted</a>
        <!-- repeat for each status -->
    </div>

    <div class="card">
        <table class="table">
            <thead><tr><th>ID</th><th>Customer</th><th>Event Date</th><th>Location</th><th>Guests</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="req : ${requests}">
                <td>#<span th:text="${req.id}"></span></td>
                <td th:text="${req.customer.fullName}"></td>
                <td th:text="${req.eventDate} + ' ' + ${req.eventTime}"></td>
                <td th:text="${req.location}"></td>
                <td th:text="${req.numberOfGuests}"></td>
                <td><span class="badge" th:classappend="'status-' + ${req.status.toLowerCase()}" th:text="${req.status}"></span></td>
                <td><a th:href="@{/staff/catering/request/{id}(id=${req.id})}" class="btn btn-sm btn-primary">View / Quote</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
