<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Driver Dashboard – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .top-bar { background: var(--ink); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
        .delivery-card { background: white; border-radius: var(--radius-lg); border-left: 4px solid var(--brand); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
        .btn-status { padding: 6px 16px; border-radius: 30px; font-weight: 600; margin: 4px; }
        .btn-pickup { background: #3B82F6; color: white; }
        .btn-transit { background: #F59E0B; color: white; }
        .btn-delivered { background: #10B981; color: white; }
    </style>
</head>
<body th:class="${role + '-theme'}">
<div class="top-bar">
    <h4><i class="fas fa-truck"></i> BakeBot Delivery</h4>
    <div>
        <span class="me-3"><span th:text="${driver.name}"></span></span>
        <a href="/logout" class="btn btn-sm btn-light">Logout</a>
    </div>
</div>

<div class="container-custom py-4">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card text-center">
                <i class="fas fa-truck fa-2x text-primary mb-2"></i>
                <h3 th:text="${totalDeliveries}">0</h3>
                <small>Total Deliveries</small>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <i class="fas fa-check-circle fa-2x text-success mb-2"></i>
                <h3 th:text="${completedCount}">0</h3>
                <small>Completed</small>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <i class="fas fa-star fa-2x text-warning mb-2"></i>
                <h3 th:text="${driver.rating}">5.0</h3>
                <small>Rating</small>
            </div>
        </div>
    </div>

    <div class="card">
        <h4 class="fw-bold mb-3">Active Deliveries</h4>
        <div th:if="${#lists.isEmpty(assignments)}" class="text-center py-4">No active deliveries.</div>
        <div th:each="assignment : ${assignments}" class="delivery-card">
            <div class="row">
                <div class="col-md-8">
                    <span class="badge" th:classappend="${assignment.assignmentType == 'ORDER_DELIVERY' ? 'badge-primary' : 'badge-warning'}" th:text="${assignment.assignmentType}"></span>
                    <span class="badge ms-2" th:classappend="'status-' + ${assignment.status}" th:text="${assignment.status}"></span>
                    <h5 class="mt-2">Customer: <span th:text="${assignment.customerName}"></span></h5>
                    <p><i class="fas fa-map-marker-alt me-1"></i><span th:text="${assignment.deliveryAddress}"></span></p>
                    <p><i class="fas fa-phone me-1"></i><span th:text="${assignment.customerPhone}"></span></p>
                </div>
                <div class="col-md-4 text-end">
                    <form th:action="@{/driver/update-status/{id}(id=${assignment.id})}" method="post" class="d-inline">
                        <input type="hidden" name="status" value="PICKED_UP">
                        <button type="submit" class="btn-status btn-pickup" th:disabled="${assignment.status != 'ASSIGNED'}">Picked Up</button>
                    </form>
                    <form th:action="@{/driver/update-status/{id}(id=${assignment.id})}" method="post" class="d-inline mt-2">
                        <input type="hidden" name="status" value="IN_TRANSIT">
                        <button type="submit" class="btn-status btn-transit" th:disabled="${assignment.status != 'PICKED_UP'}">In Transit</button>
                    </form>
                    <form th:action="@{/driver/update-status/{id}(id=${assignment.id})}" method="post" class="d-inline mt-2">
                        <input type="hidden" name="status" value="DELIVERED">
                        <button type="submit" class="btn-status btn-delivered" th:disabled="${assignment.status != 'IN_TRANSIT'}">Delivered</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
