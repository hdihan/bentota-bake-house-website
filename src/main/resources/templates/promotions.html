<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Promotions – Benthota Bake House</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        :root {
            --brand: #C8601A; --brand-dark: #9E4A12;
        }
        body {
            background: #0F0B08;
            font-family: 'DM Sans', sans-serif;
            color: rgba(255,255,255,0.85);
            margin: 0;
        }

        /* TOP NAV – dark */
        .top-nav {
            background: #1A110A;
            padding: 0 30px; height: 66px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1.5px solid rgba(200,96,26,0.2);
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
            position: sticky; top: 0; z-index: 100;
        }
        .left-area { display: flex; align-items: center; gap: 20px; }
        .btn-back {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 16px; border-radius: 8px; color: rgba(255,255,255,0.85);
            text-decoration: none; font-weight: 600; font-size: 13px; transition: all 0.2s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.15); border-color: var(--brand); color: white; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: white; font-weight: 700; }
        .right-area { display: flex; align-items: center; gap: 14px; }
        .user-chip { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 500; }
        .user-chip .avatar { width: 32px; height: 32px; background: var(--brand); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: white; }
        .btn-logout {
            background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3);
            color: #FCA5A5; padding: 8px 18px; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-logout:hover { background: rgba(239,68,68,0.3); }

        .content { padding: 30px 40px; }

        /* CARDS */
        .data-card {
            background: #1A110A; border-radius: 16px; padding: 25px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4); margin-bottom: 30px;
            border: 1.5px solid rgba(200,96,26,0.15);
        }

        /* TABLES – orange theme */
        .table {
            color: #ffffff !important;
            border-collapse: separate; border-spacing: 0; border-radius: 12px; overflow: hidden;
        }
        .table thead th {
            background-color: var(--brand) !important;
            color: white !important; border: none !important;
            padding: 14px 16px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
        }
        .table tbody td {
            background-color: rgba(200,96,26,0.08) !important;
            color: #ffffff !important; border-bottom: 1px solid rgba(200,96,26,0.2) !important;
            padding: 12px 16px;
        }
        .table tbody tr:last-child td { border-bottom: none !important; }
        .table-hover tbody tr:hover { background-color: transparent !important; }
        .table tbody tr:hover td {
            background-color: rgba(200,96,26,0.25) !important;
            transition: background-color 0.2s ease;
        }

        /* Badges */
        .badge-active { background: rgba(34,197,94,0.25) !important; color: #86EFAC !important; border: 1px solid rgba(34,197,94,0.4); }
        .badge-inactive { background: rgba(239,68,68,0.25) !important; color: #FCA5A5 !important; border: 1px solid rgba(239,68,68,0.4); }

        /* Buttons */
        .btn-primary {
            background: var(--brand); border: none; color: white; font-weight: 600; transition: all 0.2s;
        }
        .btn-primary:hover { background: var(--brand-dark); }
        .btn-outline-light {
            background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.8);
        }
        .btn-outline-light:hover { background: rgba(255,255,255,0.1); border-color: var(--brand); color: white; }
        .btn-icon {
            background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7);
            width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s; text-decoration: none;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.1); border-color: var(--brand); color: var(--brand); }
        .btn-icon.danger:hover { background: rgba(239,68,68,0.15); border-color: #FCA5A5; color: #FCA5A5; }

        /* Modals */
        .modal-content { background: #1A110A; border: 1px solid rgba(200,96,26,0.2); color: white; }
        .modal-header { border-bottom: 1px solid rgba(255,255,255,0.1); }
        .modal-footer { border-top: 1px solid rgba(255,255,255,0.1); }
        .form-label { color: rgba(255,255,255,0.7) !important; font-weight: 600; }
        .form-control, .form-select {
            background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); color: white;
        }
        .form-control:focus, .form-select:focus {
            background: rgba(255,255,255,0.15); border-color: var(--brand); box-shadow: 0 0 0 3px rgba(200,96,26,0.15);
            color: white;
        }
        .alert { background: #1A110A; border: 1.5px solid rgba(255,255,255,0.1); color: white; }
        .alert-success { border-left: 4px solid #10b981; }
        .alert-danger { border-left: 4px solid #ef4444; }
    </style>
</head>
<body th:class="${role + '-theme'}">

<nav class="top-nav">
    <div class="left-area">
        <a href="/dashboard" class="btn-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <span class="page-title">Promotions</span>
    </div>
    <div class="right-area">
        <div class="user-chip">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <span sec:authentication="name">Username</span>
        </div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn-logout"><i class="fas fa-sign-out-alt me-1"></i> Logout</button>
        </form>
    </div>
</nav>

<div class="content">
    <!-- Alerts -->
    <div th:if="${param.success}" class="alert alert-success">Promotion added successfully!</div>
    <div th:if="${param.updated}" class="alert alert-success">Promotion updated!</div>
    <div th:if="${param.deleted}" class="alert alert-danger">Promotion deleted!</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="data-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 style="color:white; font-family: 'Playfair Display', serif;"><i class="fas fa-star me-2" style="color:var(--brand)"></i>Active Campaigns</h5>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPromoModal">
                <i class="fas fa-plus me-1"></i> Add Promotion
            </button>
        </div>
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Title & Description</th>
                    <th>Discount</th>
                    <th>Duration</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="promo : ${promotions}">
                    <td>
                        <div class="fw-bold" th:text="${promo.title}"></div>
                        <small class="text-muted" th:text="${promo.description}"></small>
                    </td>
                    <td>
                        <span th:if="${promo.discountPercentage != null and promo.discountPercentage > 0}" class="badge badge-active" th:text="${promo.discountPercentage} + '% OFF'"></span>
                        <span th:unless="${promo.discountPercentage != null and promo.discountPercentage > 0}" class="text-muted">—</span>
                    </td>
                    <td>
                        <span th:text="${#temporals.format(promo.startDate, 'dd MMM yy')}"></span>
                        <span class="mx-1">–</span>
                        <span th:text="${#temporals.format(promo.endDate, 'dd MMM yy')}"></span>
                    </td>
                    <td>
                        <span th:if="${promo.status == 'Active'}" class="badge badge-active">Active</span>
                        <span th:unless="${promo.status == 'Active'}" class="badge badge-inactive">Inactive</span>
                    </td>
                    <td class="text-end">
                        <button type="button" class="btn-icon me-1" data-bs-toggle="modal"
                                th:data-bs-target="'#editPromoModal' + ${promo.id}"
                                th:data-id="${promo.id}"
                                th:data-title="${promo.title}"
                                th:data-description="${promo.description}"
                                th:data-discount="${promo.discountPercentage}"
                                th:data-start="${#temporals.format(promo.startDate, 'yyyy-MM-dd')}"
                                th:data-end="${#temporals.format(promo.endDate, 'yyyy-MM-dd')}"
                                th:data-status="${promo.status}">
                            <i class="fas fa-pen"></i>
                        </button>
                        <a th:href="@{/delete-promotion/{id}(id=${promo.id})}" class="btn-icon danger"
                           onclick="return confirm('Delete this promotion?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(promotions)}">
                    <td colspan="5" class="text-center py-4 text-muted">No promotions found. Create one!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ==================== ADD PROMOTION MODAL ==================== -->
<div class="modal fade" id="addPromoModal" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/add-promotion}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Promotion</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Title *</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Discount Percentage</label>
                    <input type="number" name="discountPercentage" class="form-control" placeholder="e.g., 10">
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">Start Date</label>
                        <input type="date" name="startDate" class="form-control">
                    </div>
                    <div class="col">
                        <label class="form-label">End Date</label>
                        <input type="date" name="endDate" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Promotion</button>
            </div>
        </form>
    </div>
</div>

<!-- ==================== EDIT PROMOTION MODALS ==================== -->
<th:block th:each="promo : ${promotions}">
    <div class="modal fade" th:id="'editPromoModal' + ${promo.id}" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{/edit-promotion/{id}(id=${promo.id})}" method="post" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Promotion</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Title *</label>
                        <input type="text" name="title" class="form-control" th:value="${promo.title}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="2" th:text="${promo.description}"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Discount Percentage</label>
                        <input type="number" name="discountPercentage" class="form-control" th:value="${promo.discountPercentage}">
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Start Date</label>
                            <input type="date" name="startDate" class="form-control" th:value="${#temporals.format(promo.startDate, 'yyyy-MM-dd')}">
                        </div>
                        <div class="col">
                            <label class="form-label">End Date</label>
                            <input type="date" name="endDate" class="form-control" th:value="${#temporals.format(promo.endDate, 'yyyy-MM-dd')}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="Active" th:selected="${promo.status == 'Active'}">Active</option>
                            <option value="Inactive" th:selected="${promo.status == 'Inactive'}">Inactive</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update Promotion</button>
                </div>
            </form>
        </div>
    </div>
</th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
