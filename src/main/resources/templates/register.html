<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Benthota Bake House</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand: #C8601A; --brand-dark: #9E4A12; --brand-light: #FDF0E6;
            --cream: #FEFAF5; --ink: #1C1410; --ink-muted: #7A6A5A; --border: #EDE0D0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; font-family: 'DM Sans', sans-serif; background: var(--cream); padding: 40px 20px; }

        .page-header { text-align: center; margin-bottom: 40px; }
        .logo-mark {
            width: 56px; height: 56px; background: var(--brand-light); border-radius: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 24px; color: var(--brand); margin-bottom: 14px; border: 1.5px solid var(--border);
        }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--ink); margin-bottom: 6px; }
        .page-header p { color: var(--ink-muted); font-size: 0.95rem; }

        .register-card {
            max-width: 620px; margin: 0 auto;
            background: white; border-radius: 20px;
            border: 1.5px solid var(--border);
            box-shadow: 0 8px 40px rgba(28,20,16,0.06);
            overflow: hidden;
        }
        .card-section { padding: 32px 36px; }
        .card-section + .card-section { border-top: 1.5px solid var(--border); }
        .section-label {
            font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--ink-muted); margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 7px; display: block; }
        .form-control, .form-select {
            width: 100%; padding: 12px 14px;
            background: var(--cream); border: 1.5px solid var(--border);
            border-radius: 10px; font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem; color: var(--ink); transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus, .form-select:focus {
            outline: none; border-color: var(--brand); background: white;
            box-shadow: 0 0 0 3px rgba(200,96,26,0.1);
        }
        .form-control::placeholder { color: #B8A898; }
        .form-error { font-size: 12px; color: #DC2626; margin-top: 5px; }

        .password-hint { font-size: 11px; color: var(--ink-muted); margin-top: 5px; }

        .recovery-box {
            background: var(--brand-light); border: 1.5px solid #F2C9A0;
            border-radius: 12px; padding: 20px;
        }
        .recovery-title { font-size: 13px; font-weight: 600; color: var(--brand-dark); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

        .card-footer-custom { padding: 24px 36px; background: var(--cream); border-top: 1.5px solid var(--border); }
        .btn-register {
            width: 100%; padding: 14px; background: var(--brand); color: white;
            border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-register:hover { background: var(--brand-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(200,96,26,0.3); }
        .login-link { text-align: center; font-size: 0.875rem; color: var(--ink-muted); margin-top: 16px; }
        .login-link a { color: var(--brand); font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
        .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .alert-danger { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; }
    </style>
</head>
<body th:class="${role + '-theme'}">
<div class="page-header">
    <div class="logo-mark"><i class="fas fa-bread-slice"></i></div>
    <h1>Create Your Account</h1>
    <p>Join us for fresh baked goods, delivered to your door</p>
</div>

<div class="register-card">
    <form th:action="@{/register}" th:object="${user}" method="post">
        <!-- Personal Info -->
        <div class="card-section">
            <div class="section-label"><i class="fas fa-user" style="color:var(--brand)"></i> Personal Information</div>
            <div th:if="${error}" class="alert alert-danger"><i class="fas fa-exclamation-circle"></i><span th:text="${error}"></span></div>
            <div class="row">
                <div class="col-md-6 form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" th:field="*{username}" placeholder="Choose a login username" required>
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="form-error"></div>
                </div>
                <div class="col-md-6 form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="Your full name" required>
                    <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="form-error"></div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" th:field="*{email}" placeholder="you@example.com" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></div>
                </div>
                <div class="col-md-6 form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" th:field="*{telephoneNumber}" placeholder="+94 XX XXX XXXX" required>
                    <div th:if="${#fields.hasErrors('telephoneNumber')}" th:errors="*{telephoneNumber}" class="form-error"></div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Delivery Address</label>
                <input type="text" class="form-control" th:field="*{homeAddress}" placeholder="Your home or delivery address" required>
                <div th:if="${#fields.hasErrors('homeAddress')}" th:errors="*{homeAddress}" class="form-error"></div>
            </div>
            <div class="form-group" style="margin-bottom:0">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="Minimum 8 characters" minlength="8" required>
                <div class="password-hint"><i class="fas fa-shield-alt me-1"></i>At least 8 characters recommended</div>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></div>
            </div>
        </div>

        <!-- Account Recovery -->
        <div class="card-section">
            <div class="section-label"><i class="fas fa-key" style="color:var(--brand)"></i> Account Recovery</div>
            <div class="recovery-box">
                <div class="recovery-title"><i class="fas fa-lock-open"></i> Security Question Setup</div>
                <div class="form-group">
                    <label class="form-label">Security Question</label>
                    <select class="form-select" th:field="*{securityQuestion}" required>
                        <option value="" disabled selected>Choose a security question…</option>
                        <option value="What city were you born in?">What city were you born in?</option>
                        <option value="What is your favorite food?">What is your favorite food?</option>
                        <option value="What is the name of your first pet?">What is the name of your first pet?</option>
                        <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                    </select>
                    <div th:if="${#fields.hasErrors('securityQuestion')}" th:errors="*{securityQuestion}" class="form-error"></div>
                </div>
                <div class="form-group" style="margin-bottom:0">
                    <label class="form-label">Your Answer</label>
                    <input type="text" class="form-control" th:field="*{securityAnswer}" placeholder="Your answer (case-sensitive)" required>
                    <div th:if="${#fields.hasErrors('securityAnswer')}" th:errors="*{securityAnswer}" class="form-error"></div>
                </div>
            </div>
        </div>

        <!-- Submit -->
        <div class="card-footer-custom">
            <button type="submit" class="btn-register"><i class="fas fa-user-plus me-2"></i>Create Account</button>
            <p class="login-link">Already have an account? <a th:href="@{/login}">Sign in here</a></p>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
