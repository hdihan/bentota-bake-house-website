<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Secure Payment – Benthota Bake House</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        :root {
            --brand: #C8601A; --brand-dark: #9E4A12; --brand-light: #FDF0E6;
            --cream: #FEFAF5; --ink: #1C1410; --ink-muted: #7A6A5A; --border: #EDE0D0;
        }
        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .payment-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            max-width: 480px;
            width: 100%;
            border: 1.5px solid var(--border);
            box-shadow: 0 12px 40px rgba(28,20,16,0.08);
        }
        .header-strip {
            background: var(--ink);
            color: white;
            text-align: center;
            padding: 14px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .amount-section {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
            color: white;
            text-align: center;
            padding: 24px;
        }
        .amount-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.85;
        }
        .amount-value {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 6px;
        }
        .card-type-selector {
            display: flex;
            gap: 8px;
            padding: 16px;
            background: var(--cream);
            border-bottom: 1.5px solid var(--border);
        }
        .card-type-option {
            flex: 1;
            text-align: center;
            padding: 12px 6px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        .card-type-option.selected {
            border-color: var(--brand);
            background: var(--brand-light);
            box-shadow: 0 0 0 3px rgba(200,96,26,0.1);
        }
        .card-type-option i {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }
        .form-body {
            padding: 24px;
        }
        .form-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin-bottom: 6px;
            display: block;
        }
        .form-control {
            width: 100%;
            padding: 13px 14px;
            background: var(--cream);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            color: var(--ink);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(200,96,26,0.1);
            background: white;
        }
        .form-control::placeholder { color: #B8A898; }
        .btn-pay {
            width: 100%;
            padding: 14px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-pay:hover {
            background: var(--brand-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(200,96,26,0.3);
        }
        .error-message {
            color: #DC2626;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body th:class="${role + '-theme'}">

<div class="payment-card">
    <!-- Header -->
    <div class="header-strip"><i class="fas fa-lock me-2"></i> Secure Payment</div>

    <!-- Amount -->
    <div class="amount-section">
        <div class="amount-label">Total Amount</div>
        <div class="amount-value">Rs. <span th:text="${summary.amount}">0.00</span></div>
    </div>

    <!-- Card Type Selection -->
    <div class="card-type-selector" id="cardTypeSelector">
        <div class="card-type-option selected" onclick="selectCardType('visa')">
            <i class="fab fa-cc-visa"></i><span>Visa</span>
        </div>
        <div class="card-type-option" onclick="selectCardType('mastercard')">
            <i class="fab fa-cc-mastercard"></i><span>Master</span>
        </div>
        <div class="card-type-option" onclick="selectCardType('amex')">
            <i class="fab fa-cc-amex"></i><span>Amex</span>
        </div>
        <div class="card-type-option" onclick="selectCardType('discover')">
            <i class="fab fa-cc-discover"></i><span>Discover</span>
        </div>
    </div>

    <!-- Form -->
    <div class="form-body">
        <form id="paymentForm" th:action="@{/demo-payment/process}" method="post">
            <input type="hidden" name="cardType" id="selectedCardType" value="visa">
            <input type="hidden" name="orderId" th:value="${summary.orderId}">

            <div class="mb-3">
                <label class="form-label">Cardholder Name</label>
                <input type="text" name="cardName" class="form-control" placeholder="As on card" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Card Number</label>
                <input type="text" name="cardNumber" class="form-control" id="cardNumber"
                       placeholder="1234 5678 9012 3456" maxlength="19" oninput="formatCardNumber(this)">
            </div>

            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label">Expiry (MM/YY)</label>
                    <input type="text" name="expiryDate" class="form-control" id="expiryDate"
                           placeholder="MM/YY" maxlength="5" oninput="formatExpiry(this)">
                </div>
                <div class="col-6">
                    <label class="form-label">CVV</label>
                    <input type="password" name="cvv" class="form-control" id="cvv"
                           placeholder="123" maxlength="3" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                </div>
            </div>

            <div class="error-message" id="formError">Please fill all fields correctly.</div>

            <button type="submit" class="btn-pay" onclick="return validateForm()">
                <i class="fas fa-credit-card me-2"></i> Pay Rs. <span th:text="${summary.amount}">0</span>
            </button>
        </form>
    </div>
</div>

<script>
    function selectCardType(type) {
        document.getElementById('selectedCardType').value = type;
        // Update selected visual
        document.querySelectorAll('.card-type-option').forEach(opt => opt.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }

    function formatCardNumber(input) {
        let value = input.value.replace(/\s/g, '').replace(/[^0-9]/g, '');
        if (value.length > 16) value = value.slice(0, 16);
        // Add space every 4 digits
        const formatted = value.match(/.{1,4}/g);
        input.value = formatted ? formatted.join(' ') : '';
    }

    function formatExpiry(input) {
        let value = input.value.replace(/[^0-9]/g, '');
        if (value.length > 4) value = value.slice(0, 4);
        if (value.length >= 2) {
            input.value = value.slice(0,2) + '/' + value.slice(2);
        } else {
            input.value = value;
        }
    }

    function validateForm() {
        const cardName = document.querySelector('input[name="cardName"]').value.trim();
        const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
        const expiry = document.getElementById('expiryDate').value;
        const cvv = document.getElementById('cvv').value;
        let error = '';

        if (!cardName) error = 'Cardholder name is required.';
        else if (cardNumber.length !== 16) error = 'Card number must be 16 digits.';
        else if (!expiry.match(/^(0[1-9]|1[0-2])\/\d{2}$/)) error = 'Expiry must be MM/YY format.';
        else if (cvv.length !== 3) error = 'CVV must be 3 digits.';

        if (error) {
            document.getElementById('formError').textContent = error;
            document.getElementById('formError').style.display = 'block';
            return false;
        }
        return true;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
