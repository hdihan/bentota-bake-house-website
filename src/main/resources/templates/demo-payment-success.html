<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful – Benthota Bake House</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        :root {
            --brand: #C8601A; --brand-dark: #9E4A12; --brand-light: #FDF0E6;
            --cream: #FEFAF5; --ink: #1C1410;
        }
        body {
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .success-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            border: 1.5px solid var(--border);
            box-shadow: 0 12px 40px rgba(28,20,16,0.08);
        }
        .icon-circle {
            width: 80px; height: 80px;
            background: #D1FAE5;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #059669;
            margin-bottom: 24px;
        }
        .success-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .success-details {
            background: var(--brand-light);
            border-radius: 12px;
            padding: 16px;
            margin: 24px 0;
            text-align: left;
        }
        .success-details .row { margin-bottom: 6px; }
        .success-details .label { font-size: 12px; font-weight: 600; color: var(--ink-muted); }
        .success-details .value { font-weight: 600; color: var(--ink); }
        .btn-home {
            background: var(--brand);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-home:hover { background: var(--brand-dark); }
    </style>
</head>
<body th:class="${role + '-theme'}">

<div class="success-box">
    <div class="icon-circle"><i class="fas fa-check-circle"></i></div>
    <h2 class="success-title">Payment Successful!</h2>
    <p class="text-muted">Thank you for your order. Your payment has been processed securely.</p>

    <div class="success-details" th:if="${orderId}">
        <div class="d-flex justify-content-between">
            <span class="label">Order ID</span>
            <span class="value" th:text="'#' + ${orderId}">#1</span>
        </div>
        <div class="d-flex justify-content-between" th:if="${amount}">
            <span class="label">Amount</span>
            <span class="value" th:text="'Rs. ' + ${amount}">0.00</span>
        </div>
        <div class="d-flex justify-content-between" th:if="${transactionId}">
            <span class="label">Transaction ID</span>
            <span class="value" th:text="${transactionId}">TXN123</span>
        </div>
    </div>

    <a href="/my-orders" class="btn-home mt-3"><i class="fas fa-receipt me-2"></i> View My Orders</a>
    <br><br>
    <a href="/home" class="text-muted" style="font-weight:500;">← Continue Shopping</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
