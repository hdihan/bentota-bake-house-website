<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Product Backlog – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body { background: var(--cream); font-family: 'DM Sans', sans-serif; }
        .top-nav {
            background: var(--ink); padding: 0 30px; height: 66px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .top-nav .left-area { display: flex; align-items: center; gap: 20px; }
        .btn-back {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.85); padding: 8px 16px; border-radius: 8px;
            text-decoration: none; font-weight: 600; font-size: 13px; transition: all 0.2s;
        }
        .btn-back:hover { background: rgba(255,255,255,0.15); border-color: var(--brand); color: white; }
        .top-nav .page-title { font-family: 'Playfair Display', serif; color: white; font-size: 1.1rem; font-weight: 700; }
        .top-nav .right-area { display: flex; align-items: center; gap: 14px; }
        .user-chip { color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .user-chip .avatar { width: 32px; height: 32px; background: var(--brand); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: white; }
        .btn-logout { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
        .btn-logout:hover { background: rgba(239,68,68,0.3); }

        .content { padding: 30px 40px; }
        .data-card { background: white; border-radius: var(--radius-lg); border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; }

        .table { margin-bottom: 0; }
        .table thead th { background: var(--cream); color: var(--ink-muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1.5px solid var(--border); padding: 14px 20px; }
        .table tbody td { padding: 14px 20px; border-bottom: 1px solid #F5EDE0; vertical-align: middle; font-size: 14px; }
        .table tbody tr:last-child td { border-bottom: none; }
        .table tbody tr:hover { background: var(--cream); }
        .product-img-small { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; background: var(--brand-light); }
        .btn-action-icon { background: #fff; border: 1px solid #e5e7eb; color: #6b7280; width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s; }
        .btn-action-icon:hover { background: var(--brand-light); border-color: var(--brand); color: var(--brand); }
        .btn-action-icon.text-danger:hover { background: #FEF2F2; border-color: #FECACA; color: #DC2626; }
        .stock-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body th:class="${role + '-theme'}">

<div class="top-nav">
    <div class="left-area">
        <a href="/dashboard" class="btn-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <span class="page-title">Product Backlog</span>
    </div>
    <div class="right-area">
        <div class="user-chip">
            <div class="avatar"><i class="fas fa-user"></i></div>
            <span sec:authentication="name">Username</span>
        </div>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn-logout"><i class="fas fa-sign-out-alt me-1"></i> Logout</button>
        </form>
    </div>
</div>

<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold" style="color:var(--ink); font-family:'Playfair Display',serif">
            <i class="fas fa-boxes me-2" style="color:var(--brand)"></i> Complete Product List
        </h3>
        <a href="/add-product" class="btn btn-primary"><i class="fas fa-plus me-1"></i> Add New Product</a>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="text-center py-5 text-muted">
        <i class="fas fa-box-open fa-4x mb-3" style="color:#ccc"></i>
        <h5>No products found.</h5>
        <p>Get started by adding your first product.</p>
    </div>

    <div th:if="${not #lists.isEmpty(products)}" class="data-card">
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th style="width:60px;">Image</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th class="text-end">Price (Rs.)</th>
                    <th class="text-center">Stock</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td>
                        <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="product-img-small">
                        <i th:unless="${product.imageUrl}" class="fas fa-bread-slice fa-2x text-muted"></i>
                    </td>
                    <td class="fw-bold" th:text="${product.name}">Product Name</td>
                    <td th:text="${product.category?.name}">Category</td>
                    <td class="text-end" th:text="'Rs. ' + ${#numbers.formatDecimal(product.price,1,2)}">0.00</td>
                    <td class="text-center">
                        <span th:if="${product.stockQuantity > 5}" class="stock-badge badge-success" th:text="${product.stockQuantity}">0</span>
                        <span th:if="${product.stockQuantity <= 5 and product.stockQuantity > 0}" class="stock-badge badge-warning" th:text="${product.stockQuantity}">0</span>
                        <span th:if="${product.stockQuantity == null or product.stockQuantity <= 0}" class="stock-badge badge-danger" th:text="${product.stockQuantity != null ? product.stockQuantity : 0}">0</span>
                    </td>
                    <td>
                        <span th:if="${product.status == 'Active'}" class="badge bg-success">Active</span>
                        <span th:unless="${product.status == 'Active'}" class="badge bg-secondary">Inactive</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/edit-product/{id}(id=${product.id})}" class="btn-action-icon me-1"><i class="fas fa-pen"></i></a>
                        <a th:href="@{/delete-product/{id}(id=${product.id})}" class="btn-action-icon text-danger" onclick="return confirm('Delete this product?')"><i class="fas fa-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
