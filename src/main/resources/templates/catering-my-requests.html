<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Catering Requests – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav">
    <div class="container">
        <a href="/home" class="brand">
            <div class="brand-icon"><i class="fas fa-bread-slice"></i></div>
            <div class="brand-text"><span class="brand-name">Benthota Bake House</span></div>
        </a>
        <div class="nav-links">
            <a href="/catering/request" class="nav-btn ghost"><i class="fas fa-plus"></i> New Request</a>
            <a href="/home" class="nav-btn ghost"><i class="fas fa-store"></i> Back to Store</a>
        </div>
    </div>
</nav>

<div class="container-custom py-5">
    <h2 class="fw-bold mb-4" style="font-family:'Playfair Display',serif">My Catering Requests</h2>

    <div th:if="${param.success}" class="alert alert-success">Request submitted successfully!</div>
    <div th:if="${param.deleted}" class="alert alert-success">Request deleted!</div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(requests)}" class="text-center py-5">
        <i class="fas fa-utensils fa-3x text-muted mb-3"></i>
        <p>No catering requests yet. <a th:href="@{/catering/request}">Create one</a>.</p>
    </div>

    <div th:each="req : ${requests}" class="card mb-3">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h5 class="fw-bold">Request #<span th:text="${req.id}"></span></h5>
                <p class="text-muted" th:text="${req.eventDate} + ' at ' + ${req.eventTime}"></p>
                <p><span th:text="${req.numberOfGuests}"></span> guests | <span th:text="${req.location}"></span></p>
            </div>
            <span class="badge" th:classappend="'status-' + ${req.status.toLowerCase()}" th:text="${req.status}"></span>
        </div>
        <div class="mt-3 d-flex gap-2">
            <a th:href="@{/catering/request/{id}(id=${req.id})}" class="btn btn-sm btn-outline">View Details</a>
            <form th:if="${req.status == 'PENDING' or req.status == 'QUOTED'}" th:action="@{/catering/request/{id}/delete(id=${req.id})}" method="post" onsubmit="return confirm('Delete?')">
                <button type="submit" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i> Delete</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
