<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Kitchen Item – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .form-container { max-width: 600px; margin: 50px auto; background: white; border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-sm); }
    </style>
</head>
<body th:class="${role + '-theme'}">
<div class="container">
    <div class="form-container">
        <h3 class="fw-bold mb-4" style="font-family:'Playfair Display',serif"><i class="fas fa-box-open me-2" style="color:var(--brand)"></i> Add New Kitchen Item</h3>
        <form th:action="@{/add-kitchen-item}" th:object="${kitchenItem}" method="post">
            <div class="mb-3">
                <label class="form-label">Item Name</label>
                <input type="text" class="form-control" th:field="*{itemName}" placeholder="e.g., Wheat Flour" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" th:field="*{category}">
                    <option value="Ingredient">Ingredient</option>
                    <option value="Packaging">Packaging</option>
                    <option value="Cleaning">Cleaning Supplies</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{quantity}" placeholder="e.g., 50" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Unit</label>
                    <select class="form-select" th:field="*{unit}">
                        <option value="kg">Kilograms (kg)</option>
                        <option value="g">Grams (g)</option>
                        <option value="liters">Liters (L)</option>
                        <option value="pcs">Pieces (pcs)</option>
                        <option value="boxes">Boxes</option>
                    </select>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Expiration Date (optional)</label>
                <input type="date" th:field="*{expirationDate}" class="form-control">
            </div>
            <div class="d-flex justify-content-between">
                <a href="/inventory" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Item</button>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
