<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assign Order Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .container-custom { max-width: 700px; margin: 40px auto; }
        .card { background: white; border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 30px; }
    </style>
</head>
<body th:class="${role + '-theme'}">
<div class="container-custom">
    <div class="card">
        <h4 class="fw-bold mb-3"><i class="fas fa-truck me-2" style="color:var(--brand)"></i> Assign Order #<span th:text="${order.id}"></span></h4>
        <p><strong>Customer:</strong> <span th:text="${order.user.fullName}"></span></p>
        <p><strong>Address:</strong> <span th:text="${order.deliveryAddress}"></span></p>
        <p><strong>Amount:</strong> Rs. <span th:text="${order.totalAmount}"></span></p>
        <form th:action="@{/staff/delivery/assign-order}" method="post">
            <input type="hidden" name="orderId" th:value="${order.id}">
            <div class="mb-3">
                <label class="form-label">Select Driver</label>
                <select name="personnelId" class="form-select" required>
                    <option value="">-- Select --</option>
                    <option th:each="p : ${availablePersonnel}" th:value="${p.id}" th:text="${p.name} + ' - ' + ${p.vehicleType} + ' (' + ${p.status} + ')'"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Notes (Optional)</label>
                <textarea name="notes" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Assign Delivery</button>
                <a href="/staff/delivery/dashboard" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
