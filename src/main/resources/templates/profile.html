<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Benthota Bake House</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        :root { --brand:#C8601A;--brand-dark:#9E4A12;--brand-light:#FDF0E6;--cream:#FEFAF5;--ink:#1C1410;--ink-muted:#7A6A5A;--border:#EDE0D0; }
        * { box-sizing: border-box; }
        body { background: var(--cream); font-family: 'DM Sans', sans-serif; margin: 0; }
        .navbar { background: var(--brand); padding: 14px 0; box-shadow: 0 4px 16px rgba(200,96,26,0.2); }
        .navbar .container { display: flex; align-items: center; justify-content: space-between; }
        .brand-link { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; }
        .brand-link .icon { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .btn-back { background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.3); color: white; padding: 8px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        .btn-back:hover { background: rgba(255,255,255,0.25); color: white; }

        .page-container { max-width: 620px; margin: 48px auto; padding: 0 20px 80px; }
        .profile-header { text-align: center; margin-bottom: 36px; }
        .avatar-circle { width: 76px; height: 76px; background: var(--brand-light); border-radius: 50%; border: 3px solid var(--brand); display: inline-flex; align-items: center; justify-content: center; font-size: 32px; color: var(--brand); margin-bottom: 14px; }
        .profile-header h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--ink); margin-bottom: 4px; }
        .profile-header p { color: var(--ink-muted); font-size: 0.9rem; }

        .profile-card { background: white; border-radius: 20px; border: 1.5px solid var(--border); overflow: hidden; box-shadow: 0 4px 24px rgba(28,20,16,0.06); }
        .card-section { padding: 28px 32px; }
        .card-section + .card-section { border-top: 1.5px solid var(--border); }
        .section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--brand); }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 7px; display: block; }
        .form-control { width: 100%; padding: 12px 14px; background: var(--cream); border: 1.5px solid var(--border); border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 0.92rem; color: var(--ink); transition: all 0.2s; }
        .form-control:focus { outline: none; border-color: var(--brand); background: white; box-shadow: 0 0 0 3px rgba(200,96,26,0.1); }
        .form-control:disabled { background: #F5F0EA; color: var(--ink-muted); cursor: not-allowed; }
        .form-control::placeholder { color: #B8A898; }
        .disabled-note { font-size: 11px; color: var(--ink-muted); margin-top: 4px; display: flex; align-items: center; gap: 5px; }

        .card-footer-section { padding: 24px 32px; background: var(--cream); border-top: 1.5px solid var(--border); }
        .btn-save { width: 100%; padding: 14px; background: var(--brand); color: white; border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-save:hover { background: var(--brand-dark); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(200,96,26,0.3); }

        .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; border: none; }
        .alert-success { background: #F0FDF4; border: 1.5px solid #BBF7D0; color: #166534; }
    </style>
</head>
<body th:class="${role + '-theme'}">
<nav class="navbar">
    <div class="container">
        <a href="/home" class="brand-link">
            <div class="icon"><i class="fas fa-bread-slice"></i></div>
            Benthota Bake House
        </a>
        <a href="/home" class="btn-back"><i class="fas fa-arrow-left me-1"></i> Return to Store</a>
    </div>
</nav>

<div class="page-container">
    <div class="profile-header">
        <div class="avatar-circle"><i class="fas fa-user"></i></div>
        <h2>My Profile</h2>
        <p>Manage your personal information and delivery details</p>
    </div>

    <div th:if="${param.updated}" class="alert alert-success">
        <i class="fas fa-check-circle"></i> Your profile has been updated successfully!
    </div>

    <div class="profile-card">
        <form th:action="@{/profile/update}" method="post">
            <div class="card-section">
                <div class="section-title"><i class="fas fa-id-card"></i> Account Details</div>
                <div class="form-group">
                    <label class="form-label">Username <span style="color:#ccc">(Login ID)</span></label>
                    <input type="text" class="form-control" th:value="${user.username}" disabled>
                    <div class="disabled-note"><i class="fas fa-lock" style="font-size:10px"></i> Username cannot be changed</div>
                </div>
                <div class="form-group" style="margin-bottom:0">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" placeholder="Your full name" required>
                </div>
            </div>

            <div class="card-section">
                <div class="section-title"><i class="fas fa-address-book"></i> Contact & Delivery</div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" th:value="${user.email}" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Telephone Number</label>
                    <input type="tel" name="telephoneNumber" class="form-control" th:value="${user.telephoneNumber}" placeholder="+94 XX XXX XXXX" required>
                </div>
                <div class="form-group" style="margin-bottom:0">
                    <label class="form-label">Home / Delivery Address</label>
                    <textarea name="homeAddress" class="form-control" rows="3" th:text="${user.homeAddress}" placeholder="Your delivery address" required></textarea>
                </div>
            </div>

            <div class="card-footer-section">
                <button type="submit" class="btn-save"><i class="fas fa-save me-2"></i>Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
