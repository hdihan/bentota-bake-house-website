<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Staff – Order Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav top-nav-dark">
    <div class="container">
        <a href="/dashboard" class="btn-back text-white"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <span class="page-title font-playfair text-white">Order Management</span>
        <div>
            <span class="text-white me-3"><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="d-inline"><button type="submit" class="btn-logout">Logout</button></form>
        </div>
    </div>
</nav>
<div class="container-custom py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold">Order Management</h3>
        <a href="/reports/inventory" class="nav-btn primary"><i class="fas fa-chart-line me-1"></i> Inventory Reports</a>
    </div>
    <div class="d-flex gap-2 mb-3">
        <a href="?status=PENDING" class="btn btn-sm btn-outline">Pending</a>
        <!-- etc -->
    </div>
    <div class="card">
        <table class="table">
            <thead><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Type</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td>#<span th:text="${order.id}"></span></td>
                <td th:text="${order.user.username}"></td>
                <td th:text="${order.orderDate}"></td>
                <td>Rs. <span th:text="${order.totalAmount}"></span></td>
                <td><span class="badge" th:classappend="'status-' + ${order.status}" th:text="${order.status}"></span></td>
                <td th:text="${order.orderType}"></td>
                <td><a th:href="@{/staff/orders/{id}(id=${order.id})}" class="btn btn-sm btn-primary">View</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
