<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Catering Request Details – Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav top-nav-dark">
    <div class="container">
        <a href="/dashboard" class="btn-back text-white"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <a href="/staff/catering/requests" class="btn-back text-white"><i class="fas fa-list"></i> All Requests</a>
        <span class="page-title font-playfair text-white">Catering Request #<span th:text="${request.id}"></span></span>
        <div>
            <span class="text-white me-3"><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="d-inline"><button type="submit" class="btn-logout">Logout</button></form>
        </div>
    </div>
</nav>

<div class="container-custom py-4">
    <div th:if="${param.quoted}" class="alert alert-success">Quotation submitted!</div>
    <div th:if="${param.statusUpdated}" class="alert alert-success">Status updated!</div>

    <div class="card">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <h3 class="fw-bold">Request #<span th:text="${request.id}"></span></h3>
            <span class="badge" th:classappend="'status-' + ${request.status.toLowerCase()}" th:text="${request.status}"></span>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="p-3 bg-cream rounded"><h5>Customer</h5>
                    <p><span th:text="${request.customer.fullName}"></span><br><span th:text="${request.customer.telephoneNumber}"></span><br><span th:text="${request.customer.email}"></span></p>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 bg-cream rounded"><h5>Event</h5>
                    <p><span th:text="${request.eventDate} + ' at ' + ${request.eventTime}"></span><br>Location: <span th:text="${request.location}"></span><br>Guests: <span th:text="${request.numberOfGuests}"></span></p>
                </div>
            </div>
        </div>

        <div th:if="${request.dietaryRestrictions}" class="mt-3"><strong>Dietary:</strong> <span th:text="${request.dietaryRestrictions}"></span></div>
        <div th:if="${request.specialRequirements}" class="mb-3"><strong>Special:</strong> <span th:text="${request.specialRequirements}"></span></div>

        <h5 class="mt-3">Items Ordered</h5>
        <table class="table">
            <thead><tr><th>Item</th><th>Description</th><th>Qty</th><th>Notes</th></tr></thead>
            <tbody>
            <tr th:each="item : ${request.items}">
                <td th:text="${item.itemName}">-</td><td th:text="${item.description}">-</td><td th:text="${item.quantity}">0</td><td th:text="${item.notes}">-</td>
            </tr>
            </tbody>
        </table>

        <!-- Quotation Form -->
        <div th:if="${request.status == 'PENDING'}" class="mt-4 p-3 border rounded">
            <h5>Provide Quotation</h5>
            <form th:action="@{/staff/catering/request/{id}/quote(id=${request.id})}" method="post">
                <div class="row">
                    <div class="col-md-4"><label class="form-label">Distance (km)</label><input type="number" step="0.1" name="distance" class="form-control"></div>
                    <div class="col-md-4"><label class="form-label">Service Charge (Rs.)</label><input type="number" step="0.01" name="serviceCharge" class="form-control" value="0"></div>
                    <div class="col-md-4"><label class="form-label">Total Quoted Price (Rs.) *</label><input type="number" step="0.01" name="totalQuotedPrice" class="form-control" required></div>
                </div>
                <div class="mt-3"><label class="form-label">Manager Notes</label><textarea name="managerNotes" class="form-control" rows="2"></textarea></div>
                <button type="submit" class="btn btn-primary mt-3">Submit Quotation & Email</button>
            </form>
        </div>

        <!-- Status Update -->
        <div class="mt-4 pt-3 border-top">
            <h5>Update Status</h5>
            <form th:action="@{/staff/catering/request/{id}/status(id=${request.id})}" method="post" class="row g-2">
                <div class="col-auto">
                    <select name="status" class="form-select">
                        <option value="PENDING" th:selected="${request.status == 'PENDING'}">Pending</option>
                        <option value="QUOTED" th:selected="${request.status == 'QUOTED'}">Quoted</option>
                        <!-- all other statuses -->
                    </select>
                </div>
                <div class="col-auto"><button type="submit" class="btn btn-primary">Update</button></div>
            </form>
        </div>

        <!-- Existing Quotation -->
        <div th:if="${request.totalQuotedPrice != null}" class="mt-4 p-3 bg-brand-light rounded">
            <h5>Quotation Details</h5>
            <p>Total: Rs. <span th:text="${request.totalQuotedPrice}"></span></p>
            <p th:if="${request.deliveryFee > 0}">Delivery Fee: Rs. <span th:text="${request.deliveryFee}"></span></p>
            <p th:if="${request.managerNotes}">Notes: <span th:text="${request.managerNotes}"></span></p>
            <small>Quoted on: <span th:text="${request.quotationDate}"></span></small>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
