<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Details – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav">
    <div class="container">
        <a href="/home" class="brand"><div class="brand-icon"><i class="fas fa-bread-slice"></i></div><span class="brand-name">Benthota Bake House</span></a>
        <a th:href="@{/my-orders}" class="nav-btn ghost">Back to Orders</a>
    </div>
</nav>
<div class="container-custom py-4">
    <div class="card">
        <div class="d-flex justify-content-between align-items-start">
            <h3 class="fw-bold">Order #<span th:text="${order.id}"></span></h3>
            <span class="badge" th:classappend="'status-' + ${order.status}" th:text="${order.status}"></span>
        </div>
        <hr>
        <div class="row">
            <div class="col-md-6">
                <p><strong>Order Date:</strong> <span th:text="${order.orderDate}"></span></p>
                <p><strong>Type:</strong> <span th:text="${order.orderType}"></span></p>
                <p><strong>Payment:</strong> <span th:text="${order.paymentMethod} / ${order.paymentStatus}"></span></p>
            </div>
            <div class="col-md-6">
                <p><strong>Delivery:</strong> <span th:text="${order.deliveryMethod}"></span></p>
                <p th:if="${order.deliveryAddress}"><strong>Address:</strong> <span th:text="${order.deliveryAddress}"></span></p>
                <p th:if="${order.pickupTime}"><strong>Pickup:</strong> <span th:text="${order.pickupTime}"></span></p>
            </div>
        </div>
        <h5 class="mt-3">Items</h5>
        <table class="table">
            <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
            <tbody>
            <tr th:each="item : ${order.items}">
                <td th:text="${item.product.name}">-</td>
                <td th:text="${item.quantity}">0</td>
                <td th:text="'Rs. ' + ${item.priceAtOrder}">0</td>
                <td th:text="'Rs. ' + (${item.priceAtOrder * item.quantity})">0</td>
            </tr>
            </tbody>
        </table>
        <div class="text-end"><h5>Total: <span th:text="'Rs. ' + ${order.totalAmount}"></span></h5></div>
        <div th:if="${order.status == 'PENDING'}" class="mt-4">
            <form th:action="@{/order/{id}/cancel(id=${order.id})}" method="post" onsubmit="return confirm('Cancel?')">
                <button type="submit" class="btn btn-danger">Cancel Order</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
