<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Order Details – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav top-nav-dark">
    <div class="container">
        <a href="/dashboard" class="btn-back text-white"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <span class="page-title font-playfair text-white">Order Details</span>
        <div>
            <span class="text-white me-3"><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="d-inline"><button type="submit" class="btn-logout">Logout</button></form>
        </div>
    </div>
</nav>
<div class="container-custom py-4">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="card">
        <h5 class="fw-bold mb-4">Recent Customer Orders</h5>
        <table class="table">
            <thead><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>
            <tr>
                <td>#ORD-1001</td><td>Nimal Perera</td><td>Today, 10:30 AM</td><td>Rs. 1,250.00</td><td><span class="badge badge-warning">Pending</span></td><td><button class="btn btn-sm btn-outline">View</button></td>
            </tr>
            <tr>
                <td>#ORD-1002</td><td>Kamal Silva</td><td>Today, 09:15 AM</td><td>Rs. 850.00</td><td><span class="badge badge-success">Completed</span></td><td><button class="btn btn-sm btn-outline">View</button></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
