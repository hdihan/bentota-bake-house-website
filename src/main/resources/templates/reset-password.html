<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Set New Password – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body { background: var(--cream); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .reset-card { background: white; border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 40px; max-width: 400px; width: 100%; text-align: center; }
    </style>
</head>
<body th:class="${role + '-theme'}">
<div class="reset-card">
    <i class="fas fa-check-circle fa-4x" style="color:var(--brand);margin-bottom:20px;"></i>
    <h4 class="fw-bold">Identity Verified!</h4>
    <p class="text-muted">Set a new password for your account.</p>
    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="New password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Password</button>
    </form>
</div>
</body>
</html>
