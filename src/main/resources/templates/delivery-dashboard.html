<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Delivery Management – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .stat-card { background: white; border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
        .btn-outline-orange { border: 1px solid var(--brand); color: var(--brand); background: transparent; padding: 4px 12px; border-radius: 6px; }
        .btn-outline-orange:hover { background: var(--brand); color: white; }
    </style>
</head>
<body th:class="${role + '-theme'}">

<nav class="top-nav top-nav-dark">
    <div class="container">
        <div class="d-flex align-items-center gap-3">
            <a href="/dashboard" class="btn-back text-white"><i class="fas fa-arrow-left"></i> Dashboard</a>
            <span class="page-title font-playfair text-white">Delivery Management</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white"><i class="fas fa-user-circle me-1"></i><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn-logout"><i class="fas fa-sign-out-alt me-1"></i> Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-custom py-4">
    <div th:if="${param.success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${param.error}" class="alert alert-danger" th:text="${error}"></div>

    <h2 class="fw-bold mb-4"><i class="fas fa-truck me-2" style="color:var(--brand)"></i>Delivery Management</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card text-center">
                <div class="stat-icon mx-auto" style="background:#FEF3C7; color:#D97706;"><i class="fas fa-truck-moving"></i></div>
                <div class="stat-value" th:text="${#lists.size(activeAssignments)}">0</div>
                <small class="text-muted">Active Deliveries</small>
            </div>
        </div>
        <!-- Repeat similar blocks for available, busy, total personnel -->
    </div>

    <!-- Pending Orders -->
    <div class="card mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5><i class="fas fa-shopping-cart me-2"></i>Pending Order Deliveries</h5>
        </div>
        <div th:if="${#lists.isEmpty(pendingOrders)}" class="text-center py-3 text-muted">No pending orders</div>
        <table th:if="${not #lists.isEmpty(pendingOrders)}" class="table">
            <thead><tr><th>Order ID</th><th>Customer</th><th>Address</th><th>Amount</th><th>Action</th></tr></thead>
            <tbody>
            <tr th:each="order : ${pendingOrders}">
                <td>#<span th:text="${order.id}"></span></td>
                <td th:text="${order.user.fullName}"></td>
                <td th:text="${order.deliveryAddress}"></td>
                <td>Rs. <span th:text="${order.totalAmount}"></span></td>
                <td><a th:href="@{/staff/delivery/assign-order/{id}(id=${order.id})}" class="btn btn-sm btn-outline">Assign</a></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pending Catering (similar) -->
    <div class="card mb-4">
        <!-- ... -->
    </div>

    <!-- Active Assignments -->
    <div class="card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5><i class="fas fa-truck-moving me-2"></i>Active Deliveries</h5>
        </div>
        <div th:if="${#lists.isEmpty(activeAssignments)}" class="text-center py-3 text-muted">No active deliveries</div>
        <table th:if="${not #lists.isEmpty(activeAssignments)}" class="table">
            <thead><tr><th>Type</th><th>Driver</th><th>Vehicle</th><th>Customer</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>
            <tr th:each="assignment : ${activeAssignments}">
                <td><span class="badge" th:classappend="${assignment.assignmentType == 'ORDER_DELIVERY' ? 'badge-primary' : 'badge-warning'}" th:text="${assignment.assignmentType}"></span></td>
                <td th:text="${assignment.deliveryPersonnel.name}"></td>
                <td th:text="${assignment.deliveryPersonnel.vehicleType}"></td>
                <td th:text="${assignment.customerName}"></td>
                <td><span class="badge" th:classappend="'status-' + ${assignment.status.toLowerCase().replace('_','-')}" th:text="${assignment.status}"></span></td>
                <td>
                    <form th:action="@{/staff/delivery/update-status/{id}(id=${assignment.id})}" method="post" class="d-flex gap-2">
                        <select name="status" class="form-select form-select-sm" style="width:120px;">
                            <option value="PICKED_UP">Picked Up</option>
                            <option value="IN_TRANSIT">In Transit</option>
                            <option value="DELIVERED">Delivered</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-outline">Update</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
