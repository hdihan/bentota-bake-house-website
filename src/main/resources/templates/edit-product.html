<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Edit Product – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav">
    <div class="container">
        <a href="/dashboard" class="btn-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <span class="page-title font-playfair">Edit Product</span>
        <div>
            <span class="fw-bold me-3"><i class="fas fa-user-circle me-1"></i><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-custom py-4">
    <div class="card mx-auto" style="max-width:700px;">
        <h3 class="fw-bold mb-4">Edit Product</h3>
        <form th:action="@{/edit-product/{id}(id=${product.id})}" method="post" enctype="multipart/form-data">
            <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" th:value="${product.name}" required></div>
            <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3" th:text="${product.description}"></textarea></div>
            <div class="row mb-3">
                <div class="col"><label class="form-label">Price (Rs.)</label><input type="number" step="0.01" name="price" class="form-control" th:value="${product.price}" required></div>
                <div class="col"><label class="form-label">Stock</label><input type="number" name="stockQuantity" class="form-control" th:value="${product.stockQuantity}" required></div>
            </div>
            <div class="row mb-4">
                <div class="col"><label class="form-label">Category</label>
                    <select name="category.id" class="form-select">
                        <option value="">-- Select --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${product.category?.id == cat.id}"></option>
                    </select>
                </div>
                <div class="col"><label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="Active" th:selected="${product.status == 'Active'}">Active</option>
                        <option value="Inactive" th:selected="${product.status == 'Inactive'}">Inactive</option>
                    </select>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Product Image</label>
                <div th:if="${product.imageUrl}" class="mb-2"><img th:src="${product.imageUrl}" style="max-height:100px" class="rounded"></div>
                <input type="file" name="imageFile" class="form-control" accept="image/*">
            </div>
            <div class="mb-4">
                <label class="form-label">Expiration Date (optional)</label>
                <input type="date" name="expirationDate" class="form-control" th:value="${product.expirationDate}">
            </div>
            <div class="d-flex justify-content-between">
                <a href="/dashboard" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Product</button>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
