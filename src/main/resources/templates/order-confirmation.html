<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav">
    <div class="container"><a href="/home" class="brand"><div class="brand-icon"><i class="fas fa-bread-slice"></i></div><span class="brand-name">Benthota Bake House</span></a></div>
</nav>
<div class="container-custom text-center py-5">
    <div class="card mx-auto" style="max-width:500px;">
        <i class="fas fa-check-circle fa-4x" style="color:var(--brand);margin-bottom:20px;"></i>
        <h3 class="fw-bold">Thank you for your order!</h3>
        <p>Your order #<span th:text="${order.id}"></span> has been placed.</p>
        <p>Status: <span th:text="${order.status}"></span></p>
        <p th:if="${order.pickupTime}">Pickup: <span th:text="${order.pickupTime}"></span></p>
        <div class="mt-4 d-flex gap-2 justify-content-center">
            <a href="/my-orders" class="btn btn-primary">View My Orders</a>
            <a href="/home" class="btn btn-outline">Continue Shopping</a>
        </div>
    </div>
</div>
</body>
</html>
