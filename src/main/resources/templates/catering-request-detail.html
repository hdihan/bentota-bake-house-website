<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catering Request #<span th:text="${request.id}"></span> – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav">
    <div class="container">
        <a href="/home" class="brand"><div class="brand-icon"><i class="fas fa-bread-slice"></i></div><span class="brand-name">Benthota Bake House</span></a>
        <a href="/catering/my-requests" class="nav-btn ghost"><i class="fas fa-arrow-left"></i> My Requests</a>
    </div>
</nav>

<div class="container-custom py-4">
    <div class="card">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <h3 class="fw-bold">Request #<span th:text="${request.id}"></span></h3>
            <span class="badge" th:classappend="'status-' + ${request.status.toLowerCase()}" th:text="${request.status}"></span>
        </div>

        <h5 class="mt-3">Event Details</h5>
        <div class="row mb-3">
            <div class="col-md-6"><strong>Date:</strong> <span th:text="${request.eventDate}"></span></div>
            <div class="col-md-6"><strong>Time:</strong> <span th:text="${request.eventTime}"></span></div>
            <div class="col-md-6"><strong>Location:</strong> <span th:text="${request.location}"></span></div>
            <div class="col-md-6"><strong>Guests:</strong> <span th:text="${request.numberOfGuests}"></span></div>
        </div>
        <div th:if="${request.dietaryRestrictions}" class="mb-2"><strong>Dietary:</strong> <span th:text="${request.dietaryRestrictions}"></span></div>
        <div th:if="${request.specialRequirements}" class="mb-3"><strong>Special:</strong> <span th:text="${request.specialRequirements}"></span></div>

        <h5>Items Ordered</h5>
        <table class="table">
            <thead><tr><th>Item</th><th>Description</th><th>Qty</th></tr></thead>
            <tbody>
            <tr th:each="item : ${request.items}">
                <td th:text="${item.itemName}">-</td>
                <td th:text="${item.description}">-</td>
                <td th:text="${item.quantity}">0</td>
            </tr>
            </tbody>
        </table>

        <div th:if="${request.totalQuotedPrice != null}" class="p-3 bg-brand-light rounded mt-4">
            <h5>Quotation</h5>
            <p><strong>Total:</strong> Rs. <span th:text="${request.totalQuotedPrice}"></span></p>
            <p th:if="${request.deliveryFee != null and request.deliveryFee > 0}"><strong>Delivery Fee:</strong> Rs. <span th:text="${request.deliveryFee}"></span></p>
            <p th:if="${request.managerNotes}"><strong>Notes:</strong> <span th:text="${request.managerNotes}"></span></p>
            <small>Quoted on: <span th:text="${request.quotationDate}"></span></small>
        </div>

        <div th:if="${request.status == 'PENDING'}" class="alert alert-info mt-3">Pending review by catering manager.</div>

        <div th:if="${request.status == 'PENDING' or request.status == 'QUOTED'}" class="mt-3">
            <form th:action="@{/catering/request/{id}/delete(id=${request.id})}" method="post" onsubmit="return confirm('Delete?')">
                <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Delete Request</button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
