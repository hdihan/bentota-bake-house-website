<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Delivery Settings – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav top-nav-dark">
    <div class="container">
        <a href="/dashboard" class="btn-back text-white"><i class="fas fa-arrow-left"></i> Dashboard</a>
        <span class="page-title font-playfair text-white">Delivery Settings</span>
        <div>
            <span class="text-white me-3"><i class="fas fa-user-circle me-1"></i><span sec:authentication="name"></span></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container-custom py-5">
    <div class="card mx-auto" style="max-width:500px;">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <h3 class="fw-bold mb-4"><i class="fas fa-cog me-2" style="color:var(--brand)"></i>Delivery Settings</h3>
        <form th:action="@{/staff/delivery-settings/update}" method="post" th:object="${settings}">
            <div class="mb-3">
                <label class="form-label">Free Delivery Distance (km)</label>
                <input type="number" step="0.1" class="form-control" th:field="*{freeDistanceKm}" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Additional Charge per Extra km (Rs.)</label>
                <input type="number" step="1" class="form-control" th:field="*{additionalCharge}" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Settings</button>
        </form>
        <div class="mt-4 p-3 bg-brand-light rounded">
            <small><i class="fas fa-info-circle me-1"></i> Example: 5 km free, Rs.500 extra per km.</small>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
