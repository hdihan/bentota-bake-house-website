<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' – Benthota Bake House'">Product Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .product-image { max-height: 400px; object-fit: cover; border-radius: var(--radius-md); }
        .star-rating { direction: rtl; display: inline-block; }
        .star-rating input { display: none; }
        .star-rating label { color: #DDD; font-size: 1.5rem; cursor: pointer; }
        .star-rating label:hover, .star-rating label:hover ~ label, .star-rating input:checked ~ label { color: #F59E0B; }
    </style>
</head>
<body th:class="${role + '-theme'}">
<nav class="top-nav">
    <div class="container">
        <a href="/home" class="brand"><div class="brand-icon"><i class="fas fa-bread-slice"></i></div><span class="brand-name">Benthota Bake House</span></a>
        <a href="/home" class="nav-btn ghost">Back to Store</a>
    </div>
</nav>
<div class="container-custom py-4">
    <div class="row">
        <div class="col-md-6 text-center">
            <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="product-image w-100">
            <i th:unless="${product.imageUrl}" class="fas fa-bread-slice fa-5x text-muted"></i>
        </div>
        <div class="col-md-6">
            <h2 class="fw-bold" th:text="${product.name}">Name</h2>
            <div class="star-row" th:with="avg=${product.averageRating != null ? product.averageRating : 0}">
                <span th:each="i : ${#numbers.sequence(1,5)}">
                    <i th:if="${i <= avg}" class="fas fa-star text-warning"></i>
                    <i th:if="${i > avg and (i - 0.5) <= avg}" class="fas fa-star-half-alt text-warning"></i>
                    <i th:if="${i > avg}" class="far fa-star text-warning"></i>
                </span>
                <small class="text-muted">(<span th:text="${#numbers.formatDecimal(avg,1,1)}">0.0</span>)</small>
            </div>
            <p class="text-muted" th:text="${product.description}">Description</p>
            <h3 class="font-playfair" style="color:var(--brand);">Rs. <span th:text="${product.price}">0.00</span></h3>
            <p><strong>Stock:</strong> <span th:text="${product.stockQuantity}">0</span> units</p>
            <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post" class="mt-3">
                <input type="hidden" name="quantity" value="1">
                <button type="submit" th:if="${product.stockQuantity > 0}" class="btn btn-primary">Add to Cart</button>
                <button th:if="${product.stockQuantity <= 0}" class="btn btn-secondary" disabled>Out of Stock</button>
            </form>
        </div>
    </div>

    <!-- Reviews Section -->
    <div class="mt-5">
        <h3 class="fw-bold">Customer Reviews</h3>
        <div th:if="${param.success}" class="alert alert-success">Review submitted!</div>
        <div th:if="${param.error}" class="alert alert-danger" th:text="${error}"></div>

        <div sec:authorize="isAuthenticated()" th:if="${!hasReviewed}" class="card p-3 mb-4">
            <h5>Write a Review</h5>
            <form th:action="@{/product/{id}/review(id=${product.id})}" method="post">
                <div class="star-rating mb-3">
                    <input type="radio" id="star5" name="rating" value="5"><label for="star5" class="fas fa-star"></label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4" class="fas fa-star"></label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3" class="fas fa-star"></label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2" class="fas fa-star"></label>
                    <input type="radio" id="star1" name="rating" value="1"><label for="star1" class="fas fa-star"></label>
                </div>
                <textarea name="comment" class="form-control mb-3" rows="3" required></textarea>
                <button type="submit" class="btn btn-primary">Submit Review</button>
            </form>
        </div>

        <div th:each="review : ${reviews}" class="card p-3 mb-2">
            <div class="d-flex justify-content-between">
                <strong th:text="${review.user.fullName ?: review.user.username}"></strong>
                <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}"></small>
            </div>
            <div class="text-warning">
                <span th:each="i : ${#numbers.sequence(1,5)}">
                    <i th:if="${i <= review.rating}" class="fas fa-star"></i>
                    <i th:if="${i > review.rating}" class="far fa-star"></i>
                </span>
            </div>
            <p th:text="${review.comment}"></p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
