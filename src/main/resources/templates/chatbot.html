<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BakeBot – Benthota Bake House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body { background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .chat-container { width: 420px; height: 650px; background: white; border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
        .chat-header { background: var(--brand); color: white; padding: 16px; text-align: center; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; background: var(--cream); }
        .message { margin-bottom: 12px; display: flex; gap: 8px; }
        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }
        .message-content { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; }
        .message.user .message-content { background: var(--brand); color: white; }
        .message.bot .message-content { background: white; border: 1px solid var(--border); }
        .chat-input-container { display: flex; padding: 12px; border-top: 1px solid var(--border); background: white; }
        .quick-replies { padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid var(--border); }
        .quick-reply-btn { background: var(--brand-light); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body th:class="${role + '-theme'}">
<div class="chat-container">
    <div class="chat-header">
        <h5 class="m-0"><i class="fas fa-robot me-2"></i> BakeBot AI Assistant</h5>
        <small>Powered by AI</small>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <div class="message-content">👋 Hello! I'm BakeBot. How can I help?</div>
        </div>
    </div>
    <div class="quick-replies">
        <button class="quick-reply-btn" onclick="sendQuickReply('Opening hours')">🕒 Hours</button>
        <button class="quick-reply-btn" onclick="sendQuickReply('Delivery')">🚚 Delivery</button>
        <button class="quick-reply-btn" onclick="sendQuickReply('Catering')">🎉 Catering</button>
        <button class="quick-reply-btn" onclick="sendQuickReply('Custom cakes')">🎂 Cakes</button>
    </div>
    <div class="chat-input-container">
        <input type="text" id="messageInput" class="form-control me-2" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="btn btn-primary" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');

    function addMessage(text, isUser) {
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'user' : 'bot'}`;
        div.innerHTML = `<div class="message-content">${text}</div>`;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage(text) {
        const msg = text || messageInput.value.trim();
        if (!msg) return;
        addMessage(msg, true);
        messageInput.value = '';
        try {
            const res = await fetch('/chatbot/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            if (data.botReply) addMessage(data.botReply.replace(/\n/g, '<br>'), false);
            else addMessage("I'm not sure. Please try again.", false);
        } catch (err) {
            addMessage("Error connecting to assistant.", false);
        }
    }

    function sendQuickReply(text) {
        messageInput.value = text;
        sendMessage(text);
    }
</script>
</body>
</html>
